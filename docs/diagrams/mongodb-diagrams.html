<!doctype html>
<html><head><meta charset="utf-8"><title>Wilco: MongoDB</title>
<style>
  :root { --ink:#0f172a; --muted:#64748b; --bg:#f4f6f3; --card:#fff; --green:#00684a; --leaf:#00ed64; --mint:#e3fcf0; --amber:#b45309; --red:#b91c1c; --navy:#001e2b; }
  * { box-sizing:border-box; margin:0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:#fff; }
  .slide { width:1280px; height:720px; background:var(--bg); padding:44px 60px; display:flex; flex-direction:column; overflow:hidden; position:relative; }
  h1 { font-size:44px; letter-spacing:-1px; font-weight:700; }
  h1 span { color:var(--green); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .ln { display:block; height:4px; background:var(--ink); position:relative; }
  .ln::after { content:""; position:absolute; right:-2px; top:-8px; border-left:15px solid var(--ink); border-top:10px solid transparent; border-bottom:10px solid transparent; }
  .ln.g { background:var(--green); } .ln.g::after { border-left-color:var(--green); }
  .down { width:4px; background:var(--green); position:absolute; }
  .down::after { content:""; position:absolute; left:-8px; bottom:-2px; border-top:15px solid var(--green); border-left:10px solid transparent; border-right:10px solid transparent; }

  /* slide 1 */
  .flow { display:flex; align-items:flex-start; margin-top:26px; }
  .who { width:170px; flex:none; text-align:center; }
  .who svg { width:150px; height:150px; display:block; margin:0 auto; }
  .who b { display:block; font-size:25px; margin-top:4px; }
  .arrow { flex:1; padding:0 10px 0 6px; position:relative; margin-top:73px; }
  .arrow i { position:absolute; left:0; right:0; top:-32px; text-align:center; font-style:normal; font-size:19px; color:var(--muted); }
  .decisions { display:flex; gap:18px; flex:none; margin-top:22px; }
  .dec { text-align:center; width:96px; }
  .dec svg { width:84px; height:84px; display:block; margin:0 auto; }
  .dec b { display:block; font-size:17px; margin-top:6px; line-height:1.15; }

  .lower { display:flex; align-items:center; gap:0; margin-top:auto; }
  .atlas { background:var(--navy); border-radius:24px; padding:20px 24px 24px; color:#fff; width:690px; flex:none; }
  .head { display:flex; align-items:center; gap:12px; font-weight:700; font-size:25px; }
  .leaf { width:17px; height:27px; background:var(--leaf); border-radius: 60% 60% 60% 60% / 80% 80% 30% 30%; }
  .cols { display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; margin-top:16px; }
  .col { background:#0b2f3c; border:1px solid #1c4a5a; border-radius:16px; padding:14px 8px 12px; text-align:center; }
  .col svg { width:62px; height:62px; display:block; margin:0 auto; color:var(--leaf); }
  .col .n { font-size:17px; font-weight:700; color:var(--leaf); margin-top:8px; }
  .toMap { flex:1; padding:0 12px 0 8px; position:relative; }
  .toMap i { position:absolute; left:0; right:0; top:-54px; text-align:center; font-style:normal; font-size:18px; font-weight:700; color:var(--green); line-height:1.1; }
  .map { width:330px; flex:none; }
  .map img { width:100%; display:block; border-radius:18px; border:4px solid var(--green); }
  .map b { display:block; text-align:center; font-size:22px; margin-top:8px; }

  /* slide 2 */
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:22px; margin-top:34px; flex:1; }
  .card { background:var(--card); border-radius:22px; padding:22px 26px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-shadow:0 1px 0 #d9dfda; }
  .card svg { width:96px; height:96px; color:var(--green); }
  .card .f { font-size:28px; font-weight:700; letter-spacing:-.4px; margin-top:10px; }
  .card .q { font-size:20px; color:var(--muted); margin-top:6px; }
</style></head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- pilot: captain with hat -->
    <symbol id="i-pilot" viewBox="0 0 120 120">
      <path d="M14 120 Q14 86 60 86 Q106 86 106 120 Z" fill="#1e293b"/>
      <path d="M52 86 L60 100 L68 86 Z" fill="#fff"/><path d="M57 92 L60 110 L63 92 Z" fill="#0f172a"/>
      <rect x="20" y="97" width="18" height="4" rx="2" fill="#facc15"/><rect x="20" y="104" width="18" height="4" rx="2" fill="#facc15"/>
      <rect x="82" y="97" width="18" height="4" rx="2" fill="#facc15"/><rect x="82" y="104" width="18" height="4" rx="2" fill="#facc15"/>
      <circle cx="60" cy="60" r="25" fill="#f1c7a0"/>
      <circle cx="51" cy="60" r="3" fill="#0f172a"/><circle cx="69" cy="60" r="3" fill="#0f172a"/>
      <path d="M50 71 Q60 79 70 71" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      <path d="M27 40 Q29 12 60 12 Q91 12 93 40 Z" fill="#1e293b"/>
      <rect x="27" y="37" width="66" height="9" fill="#facc15"/>
      <path d="M24 46 L96 46 Q98 46 96 49 Q60 60 24 49 Q22 46 24 46 Z" fill="#0f172a"/>
      <path d="M60 18 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1 Z" fill="#facc15"/>
    </symbol>
    <!-- agent: robot with headset -->
    <symbol id="i-robot" viewBox="0 0 120 120">
      <line x1="60" y1="20" x2="60" y2="8" stroke="#0f172a" stroke-width="4"/><circle cx="60" cy="7" r="6" fill="#00ed64" stroke="#0f172a" stroke-width="3"/>
      <rect x="12" y="46" width="12" height="24" rx="5" fill="#0f172a"/><rect x="96" y="46" width="12" height="24" rx="5" fill="#0f172a"/>
      <rect x="22" y="20" width="76" height="66" rx="18" fill="#e2e8f0" stroke="#0f172a" stroke-width="4"/>
      <rect x="32" y="34" width="56" height="26" rx="13" fill="#0f172a"/>
      <circle cx="47" cy="47" r="7" fill="#00ed64"/><circle cx="73" cy="47" r="7" fill="#00ed64"/>
      <path d="M46 70 H74" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
      <path d="M18 70 Q18 96 44 94" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/><rect x="42" y="89" width="14" height="10" rx="5" fill="#0f172a"/>
      <path d="M30 120 Q30 100 60 100 Q90 100 90 120 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="4"/>
    </symbol>
    <!-- policy gate: shield -->
    <symbol id="i-shield" viewBox="0 0 120 120">
      <path d="M60 6 L104 22 V58 Q104 94 60 114 Q16 94 16 58 V22 Z" fill="#e3fcf0" stroke="#00684a" stroke-width="6" stroke-linejoin="round"/>
      <path d="M38 60 L54 76 L84 42" fill="none" stroke="#00684a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-yes" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="#fff" stroke="#00684a" stroke-width="8"/><path d="M36 62 L53 79 L86 42" fill="none" stroke="#00684a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-no" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="#fff" stroke="#b91c1c" stroke-width="8"/><path d="M40 40 L80 80 M80 40 L40 80" fill="none" stroke="#b91c1c" stroke-width="11" stroke-linecap="round"/></symbol>
    <!-- supervisor: person with headset -->
    <symbol id="i-human" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="52" fill="#fff" stroke="#b45309" stroke-width="8"/>
      <path d="M30 100 Q30 74 60 74 Q90 74 90 100" fill="#b45309"/>
      <circle cx="60" cy="50" r="19" fill="#f1c7a0"/>
      <path d="M38 52 Q38 26 60 26 Q82 26 82 52" fill="none" stroke="#0f172a" stroke-width="5"/>
      <rect x="33" y="46" width="9" height="16" rx="4" fill="#0f172a"/><rect x="78" y="46" width="9" height="16" rx="4" fill="#0f172a"/>
      <path d="M82 60 Q82 72 68 70" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <!-- atlas chips -->
    <symbol id="i-id" viewBox="0 0 64 64"><rect x="6" y="12" width="52" height="40" rx="7" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="22" cy="28" r="6" fill="currentColor"/><path d="M12 44 Q12 36 22 36 Q32 36 32 44" fill="currentColor"/><path d="M38 26 H50 M38 34 H50 M38 42 H46" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></symbol>
    <symbol id="i-rules" viewBox="0 0 64 64"><path d="M16 6 H40 L52 18 V58 H16 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M40 6 V18 H52" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M23 30 l4 4 7 -8 M23 44 l4 4 7 -8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 32 H46 M40 46 H46" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 64 64"><path d="M32 58 Q12 34 12 24 A20 20 0 0 1 52 24 Q52 34 32 58 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="24" r="7" fill="currentColor"/></symbol>
    <symbol id="i-ledger" viewBox="0 0 64 64"><rect x="12" y="6" width="42" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="4"/><path d="M22 6 V58" stroke="currentColor" stroke-width="4"/><path d="M30 20 H46 M30 31 H46 M30 42 H40" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></symbol>
    <!-- slide 2 extras -->
    <symbol id="i-stream" viewBox="0 0 64 64"><path d="M6 22 Q16 10 26 22 T46 22 T58 20 M6 36 Q16 24 26 36 T46 36 T58 34 M6 50 Q16 38 26 50 T46 50 T58 48" fill="none" stroke="#00684a" stroke-width="4.5" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 64 64"><circle cx="32" cy="34" r="22" fill="none" stroke="#00684a" stroke-width="4.5"/><path d="M32 20 V34 L42 40" fill="none" stroke="#00684a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 6 H40" stroke="#00684a" stroke-width="4.5" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<section class="slide" id="s1">
  <h1><span>Atlas</span> decides before anything moves</h1>

  <div class="flow">
    <div class="who"><svg><use href="#i-pilot"/></svg><b>Pilot</b></div>
    <div class="arrow"><i>voice</i><span class="ln"></span></div>
    <div class="who"><svg><use href="#i-robot"/></svg><b>Ground agent</b></div>
    <div class="arrow"><i class="mono">MCP</i><span class="ln"></span></div>
    <div class="who" id="gate"><svg><use href="#i-shield"/></svg><b>Policy gate</b></div>
    <div class="arrow"><span class="ln"></span></div>
    <div class="decisions">
      <div class="dec"><svg><use href="#i-yes"/></svg><b>Allow</b></div>
      <div class="dec"><svg><use href="#i-human"/></svg><b>Ask a human</b></div>
      <div class="dec"><svg><use href="#i-no"/></svg><b>Deny</b></div>
    </div>
  </div>
  <div class="down" id="gateArrow"></div>

  <div class="lower">
    <div class="atlas" id="atlas">
      <div class="head"><span class="leaf"></span>MongoDB Atlas</div>
      <div class="cols">
        <div class="col"><svg><use href="#i-id"/></svg><div class="n mono">identities</div></div>
        <div class="col"><svg><use href="#i-rules"/></svg><div class="n mono">policies</div></div>
        <div class="col"><svg><use href="#i-pin"/></svg><div class="n mono">geo queries</div></div>
        <div class="col"><svg><use href="#i-ledger"/></svg><div class="n mono">ledger</div></div>
      </div>
    </div>
    <div class="toMap"><i>change<br>stream</i><span class="ln g"></span></div>
    <div class="map"><img src="map.png" alt=""><b>Live map</b></div>
  </div>
</section>


<script>
  // The gate's arrow runs from under its label down to the Atlas block.
  const slide = document.getElementById("s1").getBoundingClientRect();
  const gate = document.getElementById("gate").getBoundingClientRect();
  const atlas = document.getElementById("atlas").getBoundingClientRect();
  const a = document.getElementById("gateArrow");
  a.style.left = (gate.left + gate.width / 2 - 2 - slide.left) + "px";
  a.style.top = (gate.bottom + 6 - slide.top) + "px";
  a.style.height = Math.max(20, atlas.top - gate.bottom - 14) + "px";
  // Slide 2 reuses the Atlas chip icons in dark green.
  document.querySelectorAll("#s2 svg").forEach((s) => s.style.filter = "");
</script>
</body></html>
